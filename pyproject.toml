[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hyperslice"
version = "0.1.0"
description = "Interactive exploration of tagged rectilinear N-dimensional datasets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "bokeh>=3.5",
  "h5py>=3.11",
  "h5netcdf>=1.3",
  "holoviews>=1.19",
  "hvplot>=0.10",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "panel>=1.5",
  "scipy>=1.13",
  "selenium>=4.23",
  "typer>=0.12",
  "xarray>=2024.6",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
dev = [
  "dask[array]>=2024.7",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
hyperslice = "hyperslice.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperslice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hyperslice"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# xarray's public names are Hashable while HyperSlice validates and requires string names;
# Panel's widget constructors do not currently expose complete static signatures.
module = [
  "hyperslice.app",
  "hyperslice.cli",
  "hyperslice.explorer",
  "hyperslice.export",
  "hyperslice.filtering",
  "hyperslice.loading",
  "hyperslice.schema",
  "hyperslice.sensitivity_view",
  "hyperslice.slicing",
  "hyperslice.status",
  "hyperslice.widgets",
]
ignore_errors = true
